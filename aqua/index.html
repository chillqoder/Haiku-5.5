/* ================================================================
 * 11. Crab: articulated legs, two-bone IK and an alternating gait
 * ================================================================ */

// Closed route across the foreground, past the castle entrance, around the accent stones
const CRAB_ROUTE = [
  new THREE.Vector2(-3.2, 1.5),
  new THREE.Vector2(-1.2, 1.5),
  new THREE.Vector2(0.2, 1.5),
  new THREE.Vector2(1.6, 1.5),
  new THREE.Vector2(0.9, 0.85),
  new THREE.Vector2(0.25, 0.55),
  new THREE.Vector2(-0.55, 0.55),
  new THREE.Vector2(-1.75, 1.05),
  new THREE.Vector2(-2.8, 1.25),
];
const CRAB_PAUSE = { 2: 1.5, 5: 2.5, 7: 1.0 };   // seconds to rest after reaching these waypoints

const LEG_ANGLES = [0.85, 0.35, -0.2, -0.8];   // radial leg directions on the right side, from +X toward +Z
const LEG_Z = [0.12, 0.05, -0.02, -0.09];      // hip positions along the body
const L_FEMUR = 0.14;
const L_TIBIA = 0.16;
const COXA = 0.05;
const HIP_Y = 0.08;
const REACH = 0.27;                            // nominal foot distance from the hip
const STRIDE = 0.12;                           // body travel per gait cycle

// Cylinder limb from the origin along +X, +Z or +Y... (axis 'x' or 'z')
function limbGeometry(len, r0, r1, axis) {
  const g = new THREE.CylinderGeometry(r1, r0, len, 12, 1);
  if (axis === 'x') {
    g.rotateZ(-Math.PI / 2);
    g.translate(len / 2, 0, 0);
  } else {
    g.rotateX(Math.PI / 2);
    g.translate(0, 0, len / 2);
  }
  return g;
}

// Carapace: flattened sphere with mottled vertex colour and faint segmentation ridges
function makeCarapaceGeometry() {
  const geo = new THREE.SphereGeometry(1, 40, 24);
  geo.scale(0.21, 0.07, 0.19);
  const p = geo.attributes.position;
  const colors = new Float32Array(p.count * 3);
  const shell = new THREE.Color('#8f3b24');
  const dark = new THREE.Color('#5c2216');
  const v = new THREE.Vector3();
  const c = new THREE.Color();
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i);
    const n = valueNoise(v.x * 18, v.y * 18, v.z * 18);
    const seg = 0.5 + 0.5 * Math.cos(v.z * 22);
    c.copy(shell).lerp(dark, 0.5 + 0.3 * n);
    c.multiplyScalar(0.92 + 0.12 * seg);
    colors[3 * i] = c.r;
    colors[3 * i + 1] = c.g;
    colors[3 * i + 2] = c.b;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geo.computeVertexNormals();
  return geo;
}

// Two-bone solve in the leg plane: returns femur and tibia rotations about the leg's lateral axis
function solveLeg(d, dy) {
  const D = clamp(Math.hypot(d, dy), 0.04, L_FEMUR + L_TIBIA - 0.006);
  const a = Math.atan2(dy, d);
  const cosA = clamp((L_FEMUR * L_FEMUR + D * D - L_TIBIA * L_TIBIA) / (2 * L_FEMUR * D), -1, 1);
  const phi1 = a + Math.acos(cosA);                       // knee bends upward
  const ex = L_FEMUR * Math.cos(phi1);
  const ey = L_FEMUR * Math.sin(phi1);
  const psi = Math.atan2(dy - ey, d - ex);
  return [phi1, psi - phi1];
}

const matLegs = new THREE.MeshStandardMaterial({ color: 0x6e2b1c, roughness: 0.55 });
const matClaw = new THREE.MeshStandardMaterial({ color: 0xb5452a, roughness: 0.5 });
const matLegTip = new THREE.MeshStandardMaterial({ color: 0x2a1510, roughness: 0.6 });
const matCarapace = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.5 });

function buildLeg(root, s, i) {
  const hip = new THREE.Vector3(s * 0.11, HIP_Y, LEG_Z[i]);
  const hipGroup = new THREE.Group();
  hipGroup.name = `CrabHip${s > 0 ? 'R' : 'L'}${i}`;
  hipGroup.position.copy(hip);
  root.add(hipGroup);
  hipGroup.add(new THREE.Mesh(limbGeometry(COXA, 0.02, 0.018, 'x'), matLegs));

  const femurPivot = new THREE.Group();
  femurPivot.position.x = COXA;
  hipGroup.add(femurPivot);
  femurPivot.add(new THREE.Mesh(limbGeometry(L_FEMUR, 0.018, 0.014, 'x'), matLegs));

  const tibiaPivot = new THREE.Group();
  tibiaPivot.position.x = L_FEMUR;
  femurPivot.add(tibiaPivot);
  tibiaPivot.add(new THREE.Mesh(limbGeometry(L_TIBIA, 0.013, 0.008, 'x'), matLegs));
  const tip = new THREE.Mesh(new THREE.SphereGeometry(0.011, 10, 8), matLegTip);
  tip.position.x = L_TIBIA;
  tibiaPivot.add(tip);

  const a = LEG_ANGLES[i];
  const baseDir = new THREE.Vector3(s > 0 ? Math.cos(a) : -Math.cos(a), 0, Math.sin(a));
  return {
    s,
    i,
    // alternating tetrapod: group 0 = R0, L1, R2, L3 ; group 1 = L0, R1, L2, R3
    g: (i + (s > 0 ? 0 : 1)) % 2,
    hip,
    hipGroup,
    femurPivot,
    tibiaPivot,
    baseDir,
    plant: new THREE.Vector3(),
    from: new THREE.Vector3(),
    to: new THREE.Vector3(),
    foot: new THREE.Vector3(),
    swinging: false,
  };
}

function buildArm(body, s) {
  const arm = new THREE.Group();
  arm.name = `CrabClaw${s > 0 ? 'R' : 'L'}`;
  arm.position.set(s * 0.1, 0.0, 0.14);
  arm.rotation.y = s * 0.45;
  body.add(arm);
  arm.add(new THREE.Mesh(limbGeometry(0.13, 0.02, 0.016, 'z'), matLegs));
  const elbow = new THREE.Group();
  elbow.position.z = 0.13;
  elbow.rotation.x = -0.3;
  arm.add(elbow);
  elbow.add(new THREE.Mesh(limbGeometry(0.12, 0.016, 0.014, 'z'), matLegs));
  const wrist = new THREE.Group();
  wrist.position.z = 0.12;
  elbow.add(wrist);
  const palm = new THREE.Mesh(new THREE.SphereGeometry(0.05, 16, 12), matClaw);
  palm.scale.set(0.8, 0.7, 1.25);
  palm.position.z = 0.04;
  wrist.add(palm);
  const fixedJaw = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.025, 0.1), matClaw);
  fixedJaw.position.set(0.02, 0, 0.1);
  wrist.add(fixedJaw);
  const movingPivot = new THREE.Group();
  movingPivot.position.set(-0.02, 0, 0.07);
  wrist.add(movingPivot);
  const movingJaw = new THREE.Mesh(new THREE.BoxGeometry(0.028, 0.022, 0.085), matClaw);
  movingJaw.position.z = 0.04;
  movingPivot.add(movingJaw);
  return { arm, movingPivot };
}

function placeCrabRoot(c) {
  c.root.position.set(c.p.x, groundHeight(c.p.x, c.p.z), c.p.z);
  c.root.rotation.y = c.yaw;
  c.root.updateMatrixWorld(true);
}

// Where a leg lands when it starts a swing: nominal reach from its hip, nudged forward by the walk
const _landLocal = new THREE.Vector3();
const _ikFoot = new THREE.Vector3();
const _ikLocal = new THREE.Vector3();
function legLanding(c, leg) {
  _landLocal.copy(leg.baseDir).multiplyScalar(REACH).add(leg.hip);
  const w = c.root.localToWorld(_landLocal);
  w.x += c.dir.x * c.speed * 0.2;
  w.z += c.dir.y * c.speed * 0.2;
  w.y = groundHeight(w.x, w.z);
  return w;
}

function buildCrab() {
  const root = new THREE.Group();
  root.name = 'Crab';
  world.add(root);

  const body = new THREE.Group();
  body.name = 'CrabBody';
  body.position.y = 0.12;
  root.add(body);
  const carapace = new THREE.Mesh(makeCarapaceGeometry(), matCarapace);
  carapace.castShadow = true;
  body.add(carapace);

  // Eyestalks with glossy eyes, and a small mouth cluster
  const eyeStalks = [];
  for (const s of [-1, 1]) {
    const stalk = new THREE.Group();
    stalk.position.set(s * 0.05, 0.03, 0.19);
    stalk.rotation.x = 0.5;
    body.add(stalk);
    stalk.add(new THREE.Mesh(limbGeometry(0.07, 0.012, 0.01, 'x').rotateZ(Math.PI / 2), matLegs));
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.02, 14, 10), matEye);
    eye.position.y = 0.075;
    stalk.add(eye);
    eyeStalks.push({ stalk, phase: s > 0 ? 0 : 1.3 });
  }
  const mouth = new THREE.Mesh(new THREE.ConeGeometry(0.02, 0.05, 8), matLegTip);
  mouth.position.set(0, -0.03, 0.2);
  mouth.rotation.x = Math.PI / 2;
  body.add(mouth);

  const arms = [buildArm(body, -1), buildArm(body, 1)];

  const legs = [];
  for (const s of [1, -1]) {
    for (let i = 0; i < 4; i++) legs.push(buildLeg(root, s, i));
  }

  const c = {
    root,
    body,
    legs,
    arms,
    eyeStalks,
    p: new THREE.Vector3(CRAB_ROUTE[0].x, 0, CRAB_ROUTE[0].y),
    dir: new THREE.Vector2(),
    targetDir: new THREE.Vector2(),
    yaw: 0,
    speed: 0,
    wanted: 0,
    phase: 0,
    wp: 1,
    pause: 0,
    clawOpen: 0.2,
  };
  const first = CRAB_ROUTE[1];
  c.dir.set(first.x - c.p.x, first.y - c.p.z).normalize();
  c.targetDir.copy(c.dir);
  c.yaw = Math.atan2(-c.dir.y, c.dir.x);
  placeCrabRoot(c);
  for (const leg of legs) {
    leg.plant.copy(legLanding(c, leg));
    leg.from.copy(leg.plant);
    leg.to.copy(leg.plant);
    leg.foot.copy(leg.plant);
  }
  return c;
}

function updateCrab(c, dt, t) {
  // Route following: turn toward the next waypoint, rest at selected ones
  if (c.pause > 0) {
    c.pause -= dt;
    c.wanted = 0;
  } else {
    const wp = CRAB_ROUTE[c.wp];
    const dx = wp.x - c.p.x;
    const dz = wp.y - c.p.z;
    const dist = Math.hypot(dx, dz);
    if (dist < 0.12) {
      c.pause = CRAB_PAUSE[c.wp] || 0;
      c.wp = (c.wp + 1) % CRAB_ROUTE.length;
      c.wanted = c.pause > 0 ? 0 : 0.11;
    } else {
      c.wanted = 0.11;
      c.targetDir.set(dx / dist, dz / dist);
    }
  }
  c.speed += clamp(c.wanted - c.speed, -0.25 * dt, 0.25 * dt);

  // Heading turns at a limited rate; the body yaws so its side (+X) faces the travel direction
  const cur = Math.atan2(c.dir.y, c.dir.x);
  const tgt = Math.atan2(c.targetDir.y, c.targetDir.x);
  let diff = tgt - cur;
  if (diff > Math.PI) diff -= TAU;
  else if (diff < -Math.PI) diff += TAU;
  const next = cur + clamp(diff, -1.4 * dt, 1.4 * dt);
  c.dir.set(Math.cos(next), Math.sin(next));
  c.yaw = Math.atan2(-c.dir.y, c.dir.x);
  c.p.x += c.dir.x * c.speed * dt;
  c.p.z += c.dir.y * c.speed * dt;

  // Gait phase advances with distance walked; when stopping, finish the swing and rest with all feet planted
  const rate = c.speed / STRIDE;
  const frac0 = c.phase - Math.floor(c.phase);
  const doubleStance = (frac0 >= 0.42 && frac0 < 0.5) || frac0 >= 0.92;
  if (c.speed > 0.004) c.phase += rate * dt;
  else if (!doubleStance) c.phase += 1.2 * dt;

  placeCrabRoot(c);
  const frac = c.phase - Math.floor(c.phase);
  for (const leg of c.legs) {
    const start = leg.g === 0 ? 0 : 0.5;
    const inWindow = frac >= start && frac < start + 0.42;
    if (inWindow && !leg.swinging) {
      leg.swinging = true;
      leg.from.copy(leg.plant);
      leg.to.copy(legLanding(c, leg));
    } else if (!inWindow && leg.swinging) {
      leg.swinging = false;
      leg.plant.copy(leg.to);
    }
    if (leg.swinging) {
      const s = (frac - start) / 0.42;
      const e = s * s * (3 - 2 * s);
      leg.foot.lerpVectors(leg.from, leg.to, e);
      leg.foot.y += 0.06 * Math.sin(Math.PI * s);
    } else {
      leg.foot.copy(leg.plant);
    }
  }

  // Inverse kinematics: aim each hip at its foot, then solve femur and tibia in that leg's plane
  for (const leg of c.legs) {
    _ikFoot.copy(leg.foot);
    c.root.worldToLocal(_ikFoot);
    const v = _ikLocal.subVectors(_ikFoot, leg.hip);
    leg.hipGroup.rotation.y = Math.atan2(-v.z, v.x);
    const d = Math.hypot(v.x, v.z) - COXA;
    const [phi1, phi2] = solveLeg(d, v.y);
    leg.femurPivot.rotation.z = phi1;
    leg.tibiaPivot.rotation.z = phi2;
  }

  // Gentle breathing bob, claws opening while resting, eyestalks drifting
  c.body.position.y = 0.12 + 0.004 * Math.sin(t * 2.1);
  const resting = c.speed < 0.01;
  const clawTarget = resting ? 0.35 + 0.25 * Math.sin(t * 1.3) : 0.12;
  c.clawOpen += (clawTarget - c.clawOpen) * Math.min(1, 4 * dt);
  for (const a of c.arms) a.movingPivot.rotation.y = c.clawOpen;
  for (const e of c.eyeStalks) e.stalk.rotation.z = 0.08 * Math.sin(t * 1.7 + e.phase);
}

const crab = buildCrab();

/* ================================================================
 * 12. Snails: a bottom crawler and a glass crawler
 * ================================================================ */

// Helical shell: a tube swept along a widening, slightly conical spiral
function buildShellGeometry(turns = 2.6, r0 = 0.035, r1 = 0.085) {
  const nU = 260;
  const nV = 22;
  const maxT = turns * TAU;
  const growth = Math.log(r1 / r0) / maxT;
  const pos = [];
  const uvs = [];
  const idx = [];
  for (let i = 0; i <= nU; i++) {
    const u = i / nU;
    const t = u * maxT;
    const R = r0 * Math.exp(growth * t);
    const tubeR = 0.24 * R;
    const cx = R * Math.cos(t);
    const cy = R * Math.sin(t);
    const cz = 0.05 * u;
    const rx = Math.cos(t);
    const ry = Math.sin(t);
    for (let j = 0; j <= nV; j++) {
      const phi = (j / nV) * TAU;
      const cp = Math.cos(phi);
      const sp = Math.sin(phi);
      pos.push(cx + tubeR * cp * rx, cy + tubeR * cp * ry, cz + tubeR * sp);
      uvs.push(u, j / nV);
    }
  }
  for (let i = 0; i < nU; i++) {
    for (let j = 0; j < nV; j++) {
      const a = i * (nV + 1) + j, b = a + 1, d = a + nV + 1, e = d + 1;
      idx.push(a, d, b, b, d, e);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  // Lie the coil flat on the body with the spire rising
  geo.rotateX(-Math.PI / 2);
  return geo;
}

// Shared snail body: soft foot with lateral pedal waves, a small head and two tentacles with eyes
function buildSnailBody(root, shellMat) {
  const body = new THREE.Group();
  body.name = 'SnailBody';
  root.add(body);
  const footBody = buildFishBody(SNAIL_FOOT_SPEC);
  const footMesh = new THREE.Mesh(footBody.geo, matSnailFoot);
  footMesh.position.y = footBody.maxH;      // sole sits exactly on y = 0
  footMesh.castShadow = true;
  body.add(footMesh);

  const head = new THREE.Mesh(new THREE.SphereGeometry(0.03, 16, 12), matSnailHead);
  head.scale.set(1, 0.85, 1.2);
  head.position.set(0, 0.035, 0.17);
  body.add(head);

  const tentacles = [];
  for (const s of [-1, 1]) {
    const pivot = new THREE.Group();
    pivot.position.set(s * 0.012, 0.05, 0.19);
    body.add(pivot);
    pivot.add(new THREE.Mesh(limbGeometry(0.07, 0.005, 0.003, 'x').rotateZ(Math.PI / 2), matSnailHead));
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.008, 10, 8), matEye);
    eye.position.y = 0.07;
    pivot.add(eye);
    tentacles.push({ pivot, phase: s > 0 ? 0 : 2.1 });
  }

  const shell = new THREE.Mesh(buildShellGeometry(), shellMat);
  shell.name = 'SnailShell';
  shell.position.set(0, 0.1, -0.03);
  shell.castShadow = true;
  body.add(shell);
  return { footBody, tentacles };
}

function animateSnail(s, t) {
  updateFishBody(s.footBody, t * 3.2, 0.005, 9.0);   // pedal waves
  for (const tn of s.tentacles) tn.pivot.rotation.x = -0.35 + 0.25 * Math.sin(t * 1.7 + tn.phase);
}

// Bottom crawler: slow ping-pong along a foreground route, climbing the small stone on the way
function buildSnailBottom() {
  const root = new THREE.Group();
  root.name = 'SnailBottom';
  world.add(root);
  const parts = buildSnailBody(root, matShellA);
  const s = {
    root,
    ...parts,
    x: -1.2,
    z: -0.12,
    xMin: -1.55,
    xMax: 1.0,
    dir: 1,
    pause: 0,
    speed: 0.028,
  };
  s.update = (dt, t) => {
    if (s.pause > 0) {
      s.pause -= dt;
    } else {
      s.x += s.dir * s.speed * dt;
      if (s.x > s.xMax) {
        s.x = s.xMax;
        s.dir = -1;
        s.pause = 3.5;
      } else if (s.x < s.xMin) {
        s.x = s.xMin;
        s.dir = 1;
        s.pause = 3.5;
      }
    }
    s.root.position.set(s.x, groundHeight(s.x, s.z), s.z);
    s.root.rotation.y = s.dir > 0 ? Math.PI / 2 : -Math.PI / 2;
    animateSnail(s, t);
  };
  return s;
}

// Glass crawler: sole pressed on the inside of the front pane, shell pointing into the water
function buildSnailGlass() {
  const root = new THREE.Group();
  root.name = 'SnailGlass';
  world.add(root);
  const parts = buildSnailBody(root, matShellB);
  const p0 = new THREE.Vector2(-1.45, 1.05);
  const p1 = new THREE.Vector2(-1.15, 1.42);
  const s = {
    root,
    ...parts,
    p0,
    p1,
    len: p0.distanceTo(p1),
    u: 0.2,
    dir: 1,
    speed: 0.016,
  };
  const Y = new THREE.Vector3(0, 0, -1);
  const Z = new THREE.Vector3();
  const X = new THREE.Vector3();
  const basis = new THREE.Matrix4();
  s.update = (dt, t) => {
    s.u += s.dir * s.speed * dt / s.len;
    if (s.u >= 1) {
      s.u = 1;
      s.dir = -1;
    } else if (s.u <= 0) {
      s.u = 0;
      s.dir = 1;
    }
    const e = s.u * s.u * (3 - 2 * s.u);
    const x = lerp(p0.x, p1.x, e);
    const y = lerp(p0.y, p1.y, e);
    const fx = ((p1.x - p0.x) / s.len) * s.dir;
    const fy = ((p1.y - p0.y) / s.len) * s.dir;
    Z.set(fx, fy, 0);
    X.crossVectors(Y, Z);
    basis.makeBasis(X, Y, Z);
    s.root.quaternion.setFromRotationMatrix(basis);
    s.root.position.set(x, y, WATER.z1);
    animateSnail(s, t);
  };
  return s;
}

const snails = [buildSnailBottom(), buildSnailGlass()];

/* ================================================================
 * 13. Shared current, bubble plume, ripples and suspended particles
 * ================================================================ */

// One gentle current field: large slow drift plus a rising, slowly widening plume above the filter
const PLUME = { x: FILTER.x, z: FILTER.z, y0: FILTER_OUTLET.y };

function currentAt(x, y, z, t, out) {
  let ux = 0.010 * Math.sin(0.31 * t + 0.8 * z + 0.2) + 0.007 * Math.sin(0.57 * t - 1.3 * x);
  let uz = 0.009 * Math.cos(0.27 * t + 0.9 * x) + 0.006 * Math.sin(0.43 * t + 1.1 * z);
  let uy = 0.003 * Math.sin(0.5 * t + x + z);
  const dx = x - PLUME.x;
  const dz = z - PLUME.z;
  const h = clamp((y - PLUME.y0) / (WATER_Y - PLUME.y0), 0, 1.2);
  const sigma = 0.14 + 0.2 * h;
  const g = Math.exp(-(dx * dx + dz * dz) / (2 * sigma * sigma)) * (1 - 0.6 * h) * (y > PLUME.y0 - 0.1 ? 1 : 0);
  uy += 0.11 * g;
  ux -= dx * 0.05 * g;
  uz -= dz * 0.05 * g;
  return out.set(ux, uy, uz);
}
const _cur = new THREE.Vector3();

/* ---------- Bubble pool (instanced, recycled) ---------- */

const BUBBLE_MAX = 260;

const bubbleMaterial = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: false,
  uniforms: { uLightDir: { value: KEY_DIR.clone() } },
  vertexShader: /* glsl */`
    varying vec3 vNw;
    varying vec3 vVw;
    void main() {
      mat3 im = mat3(instanceMatrix);
      vNw = normalize(im * normal);
      vec4 wp = modelMatrix * instanceMatrix * vec4(position, 1.0);
      vVw = normalize(cameraPosition - wp.xyz);
      gl_Position = projectionMatrix * viewMatrix * wp;
    }`,
  fragmentShader: /* glsl */`
    uniform vec3 uLightDir;
    varying vec3 vNw;
    varying vec3 vVw;
    void main() {
      vec3 N = normalize(vNw);
      vec3 V = normalize(vVw);
      float ndv = clamp(dot(N, V), 0.0, 1.0);
      float fres = pow(1.0 - ndv, 3.0);
      float hl = smoothstep(0.72, 0.92, dot(N, normalize(vec3(-0.5, 0.7, 0.5))));
      float spec = pow(max(dot(reflect(-normalize(uLightDir), N), V), 0.0), 40.0);
      float rim = smoothstep(0.55, 0.9, dot(N, normalize(vec3(0.6, -0.3, -0.6)))) * 0.6;
      vec3 col = vec3(0.78, 0.92, 1.0) * (0.05 + 0.45 * fres)
        + vec3(1.0) * (hl * 0.9 + spec * 0.5)
        + vec3(0.6, 0.9, 1.0) * rim;
      float alpha = clamp(0.10 + 0.55 * fres + hl * 0.8 + spec * 0.4, 0.0, 0.92);
      gl_FragColor = vec4(col, alpha);
    }`,
});
const bubbleMesh = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1, 2), bubbleMaterial, BUBBLE_MAX);
bubbleMesh.name = 'AirBubbles';
bubbleMesh.frustumCulled = false;
world.add(bubbleMesh);

const bubbleState = {
  alive: new Uint8Array(BUBBLE_MAX),
  x: new Float32Array(BUBBLE_MAX),
  y: new Float32Array(BUBBLE_MAX),
  z: new Float32Array(BUBBLE_MAX),
  r: new Float32Array(BUBBLE_MAX),
  rise: new Float32Array(BUBBLE_MAX),
  dx: new Float32Array(BUBBLE_MAX),
  dz: new Float32Array(BUBBLE_MAX),
  wAmp: new Float32Array(BUBBLE_MAX),
  wFreq: new Float32Array(BUBBLE_MAX),
  wPhase: new Float32Array(BUBBLE_MAX),
  age: new Float32Array(BUBBLE_MAX),
  spawnAcc: 0,
};
const bubbleRng = mulberry32(4242);
const ZERO_MATRIX = new THREE.Matrix4().makeScale(0, 0, 0);
const IDENTITY_QUAT = new THREE.Quaternion();
const _bPos = new THREE.Vector3();
const _bScale = new THREE.Vector3();
const _bMat = new THREE.Matrix4();
for (let i = 0; i < BUBBLE_MAX; i++) bubbleMesh.setMatrixAt(i, ZERO_MATRIX);

function spawnBubble() {
  const s = bubbleState;
  let i = -1;
  for (let k = 0; k < BUBBLE_MAX; k++) {
    if (!s.alive[k]) {
      i = k;
      break;
    }
  }
  if (i < 0) return;
  s.alive[i] = 1;
  s.x[i] = FILTER_OUTLET.x + (bubbleRng() - 0.5) * 0.02;
  s.y[i] = FILTER_OUTLET.y + (bubbleRng() - 0.5) * 0.01;
  s.z[i] = FILTER_OUTLET.z + (bubbleRng() - 0.5) * 0.02;
  // mostly small bubbles, occasionally a larger one
  s.r[i] = bubbleRng() < 0.82 ? 0.018 + 0.012 * bubbleRng() : 0.03 + 0.02 * bubbleRng();
  s.rise[i] = 0.36 + 0.18 * bubbleRng() + 1.5 * s.r[i];
  const ang = bubbleRng() * TAU;
  const spread = 0.02 + 0.05 * bubbleRng();
  s.dx[i] = Math.cos(ang) * spread;
  s.dz[i] = Math.sin(ang) * spread;
  s.wAmp[i] = 0.012 + 0.012 * bubbleRng();
  s.wFreq[i] = 2 + 2 * bubbleRng();
  s.wPhase[i] = bubbleRng() * TAU;
  s.age[i] = 0;
}

/* ---------- Surface ripples: a fixed pool of expanding rings ---------- */

const RIPPLE_COUNT = 16;
// Each Vector4 holds (x, z, birth time, amplitude); amplitude 0 marks a free slot
const rippleUniform = { value: Array.from({ length: RIPPLE_COUNT }, () => new THREE.Vector4(0, 0, 0, 0)) };

function addRipple(x, z, amp, t) {
  const slots = rippleUniform.value;
  // bursts of nearby arrivals merge into one ring
  for (const v of slots) {
    if (v.w > 0 && t - v.z < 0.6 && Math.hypot(v.x - x, v.y - z) < 0.3) {
      v.w += amp;
      return;
    }
  }
  let slot = slots[0];
  for (const v of slots) {
    if (v.w <= 0) {
      slot = v;
      break;
    }
    if (v.z < slot.z) slot = v;
  }
  slot.set(x, z, t, amp);
}

function updateBubbles(dt, t) {
  const s = bubbleState;
  for (const v of rippleUniform.value) {
    if (v.w > 0 && t - v.z > 5) v.w = 0;
  }
  s.spawnAcc += dt * (13 + 4 * Math.sin(t * 0.7) + 2.5 * Math.sin(t * 2.3 + 1));
  while (s.spawnAcc >= 1) {
    s.spawnAcc -= 1;
    spawnBubble();
  }
  for (let i = 0; i < BUBBLE_MAX; i++) {
    if (!s.alive[i]) continue;
    s.age[i] += dt;
    currentAt(s.x[i], s.y[i], s.z[i], t, _cur);
    const wob = s.wAmp[i] * Math.cos(s.wFreq[i] * s.age[i] + s.wPhase[i]);
    s.x[i] += (s.dx[i] + _cur.x + wob) * dt;
    s.z[i] += (s.dz[i] + _cur.z + 0.6 * wob) * dt;
    s.y[i] += (s.rise[i] + _cur.y) * dt;
    // slight expansion, never shrinking on the way up
    s.r[i] *= 1 + 0.015 * dt;
    if (s.y[i] + s.r[i] >= WATER_Y - 0.004) {
      addRipple(s.x[i], s.z[i], 0.0035 + 0.06 * s.r[i], t);
      s.alive[i] = 0;
      bubbleMesh.setMatrixAt(i, ZERO_MATRIX);
      continue;
    }
    _bPos.set(s.x[i], s.y[i], s.z[i]);
    _bMat.compose(_bPos, IDENTITY_QUAT, _bScale.setScalar(s.r[i]));
    bubbleMesh.setMatrixAt(i, _bMat);
  }
  bubbleMesh.instanceMatrix.needsUpdate = true;
}

/* ---------- Faint suspended particles (clean water, visible depth) ---------- */

const PARTICLE_COUNT = 170;
const particlePositions = new Float32Array(PARTICLE_COUNT * 3);
const particleSizes = new Float32Array(PARTICLE_COUNT);
const particleRng = mulberry32(99);
for (let i = 0; i < PARTICLE_COUNT; i++) {
  particlePositions[3 * i] = lerp(WATER.x0 + 0.2, WATER.x1 - 0.2, particleRng());
  particlePositions[3 * i + 1] = lerp(0.4, WATER_Y - 0.3, particleRng());
  particlePositions[3 * i + 2] = lerp(WATER.z0 + 0.2, WATER.z1 - 0.2, particleRng());
  particleSizes[i] = 0.012 + 0.02 * particleRng();
}
const particleGeometry = new THREE.BufferGeometry();
particleGeometry.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
particleGeometry.setAttribute('aSize', new THREE.BufferAttribute(particleSizes, 1));
const particleMaterial = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: false,
  uniforms: { uScale: { value: 400 }, uOpacity: { value: 0.5 } },
  vertexShader: /* glsl */`
    attribute float aSize;
    uniform float uScale;
    varying float vA;
    void main() {
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = aSize * uScale / max(-mv.z, 0.1);
      gl_Position = projectionMatrix * mv;
      vA = 0.6;
    }`,
  fragmentShader: /* glsl */`
    uniform float uOpacity;
    varying float vA;
    void main() {
      float d = length(gl_PointCoord - 0.5);
      float a = smoothstep(0.5, 0.0, d) * uOpacity * vA;
      gl_FragColor = vec4(vec3(0.82, 0.95, 1.0), a);
    }`,
});
const particlesMesh = new THREE.Points(particleGeometry, particleMaterial);
particlesMesh.name = 'SuspendedParticles';
particlesMesh.frustumCulled = false;
world.add(particlesMesh);

function updateParticles(dt, t) {
  for (let i = 0; i < PARTICLE_COUNT; i++) {
    const k = 3 * i;
    const x = particlePositions[k];
    const y = particlePositions[k + 1];
    const z = particlePositions[k + 2];
    currentAt(x, y, z, t, _cur);
    particlePositions[k] = x + (_cur.x * 0.8 + 0.003 * Math.sin(t * 0.7 + i)) * dt;
    particlePositions[k + 1] = y + _cur.y * 0.8 * dt;
    particlePositions[k + 2] = z + (_cur.z * 0.8 + 0.003 * Math.cos(t * 0.6 + i * 1.3)) * dt;
    // wrap inside the water body
    if (particlePositions[k] > WATER.x1 - 0.2) particlePositions[k] = WATER.x0 + 0.2;
    if (particlePositions[k] < WATER.x0 + 0.2) particlePositions[k] = WATER.x1 - 0.2;
    if (particlePositions[k + 1] > WATER_Y - 0.3) particlePositions[k + 1] = 0.4;
    if (particlePositions[k + 2] > WATER.z1 - 0.2) particlePositions[k + 2] = WATER.z0 + 0.2;
    if (particlePositions[k + 2] < WATER.z0 + 0.2) particlePositions[k + 2] = WATER.z1 - 0.2;
  }
  particleGeometry.attributes.position.needsUpdate = true;
}

 * 14. Water surface, meniscus and glass panes

// Shared uniforms: the surface and the glass sample the underwater image and its depth
const overlayUniforms = {
  uTime: CAUSTIC.uTime,
  uWaterY: { value: WATER_Y },
  uRipples: rippleUniform,
  uComp: { value: null },
  uSceneDepth: { value: null },
  uRes: { value: new THREE.Vector2(1, 1) },
  uCamPos: { value: new THREE.Vector3() },
  uViewProj: { value: new THREE.Matrix4() },
  uInvViewProj: { value: new THREE.Matrix4() },
  uKeyDir: { value: KEY_DIR.clone() },
};

const WATER_VERT = /* glsl */`
uniform float uTime;
uniform float uWaterY;
uniform vec4 uRipples[16];
varying vec3 vWorld;
varying vec3 vNrm;
varying float vWallFade;

// Four travelling waves in different directions: returns (height, dh/dx, dh/dz)
vec3 waveField(vec2 p, float t) {
  vec3 r = vec3(0.0);
  for (int i = 0; i < 4; i++) {
    vec2 d;
    float k;
    float w;
    float a;
    if (i == 0) { d = vec2(0.92, 0.39); k = 2.6; w = 1.05; a = 0.020; }
    else if (i == 1) { d = vec2(-0.55, 0.84); k = 3.7; w = 1.35; a = 0.012; }
    else if (i == 2) { d = vec2(0.31, -0.95); k = 6.1; w = 2.2; a = 0.0055; }
    else { d = vec2(-0.87, -0.49); k = 9.4; w = 3.1; a = 0.0026; }
    float ph = dot(d, p) * k + w * t;
    float s = sin(ph);
    float c = cos(ph);
    r.x += a * s;
    r.y += a * k * d.x * c;
    r.z += a * k * d.y * c;
  }
  return r;
}

// Expanding Gaussian ring from one bubble arrival
vec3 rippleField(vec2 p, vec4 rp, float t) {
  float age = t - rp.z;
  if (rp.w <= 0.0 || age < 0.0 || age > 4.5) return vec3(0.0);
  vec2 d = p - rp.xy;
  float r = max(length(d), 1e-4);
  float x = r - age * 0.7;
  float env = exp(-x * x / 0.010) * exp(-age * 1.1);
  float k = 40.0;
  float f = sin(k * x) * env * rp.w;
  float df = (k * cos(k * x) - sin(k * x) * 2.0 * x / 0.010) * env * rp.w;
  return vec3(f, df * d.x / r, df * d.y / r);
}

void main() {
  vec3 p = position;
  vec2 xz = p.xz;
  // waves calm down toward the glass so the surface meets the walls quietly
  float dWall = min(3.94 - abs(xz.x), 1.94 - abs(xz.y));
  float fade = smoothstep(0.02, 0.4, dWall);
  vec3 wf = waveField(xz, uTime) * fade;
  for (int i = 0; i < 16; i++) {
    wf += rippleField(xz, uRipples[i], uTime);
  }
  p.y = uWaterY + wf.x;
  vNrm = normalize(vec3(-wf.y, 1.0, -wf.z));
  vWorld = p;
  vWallFade = fade;
  gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
}`;

const WATER_FRAG = /* glsl */`
uniform sampler2D uComp;
uniform sampler2D uSceneDepth;
uniform vec2 uRes;
uniform vec3 uCamPos;
uniform mat4 uViewProj;
uniform mat4 uInvViewProj;
uniform float uWaterY;
uniform vec3 uKeyDir;
varying vec3 vWorld;
varying vec3 vNrm;
varying float vWallFade;
${GLSL_STUDIO_ENV}

vec2 projUV(vec3 p) {
  vec4 c = uViewProj * vec4(p, 1.0);
  return c.xy / c.w * 0.5 + 0.5;
}

// World position of whatever the scene depth buffer holds at a screen position
vec3 worldAt(vec2 uv) {
  float d = texture2D(uSceneDepth, uv).r;
  vec4 w = uInvViewProj * vec4(uv * 2.0 - 1.0, d * 2.0 - 1.0, 1.0);
  return w.xyz / w.w;
}

void main() {
  // Hidden by opaque geometry in front of the surface (rim, pedestal)
  vec2 suv = gl_FragCoord.xy / uRes;
  float sceneZ = texture2D(uSceneDepth, suv).r;
  if (gl_FragCoord.z > sceneZ + 0.00025) discard;

  vec3 N = normalize(vNrm);
  if (!gl_FrontFacing) N = -N;
  vec3 V = normalize(uCamPos - vWorld);
  vec3 I = -V;
  float ndv = clamp(dot(N, V), 0.0, 1.0);
  float F = 0.02 + 0.98 * pow(1.0 - ndv, 5.0);

  // Refraction bends the view ray into the water (IOR ~1.333); each channel uses a slightly different IOR
  vec3 tR = refract(I, N, 1.0 / 1.322);
  vec3 tG = refract(I, N, 1.0 / 1.333);
  vec3 tB = refract(I, N, 1.0 / 1.345);
  float depthGuess = 1.15;
  vec2 uvR = clamp(projUV(vWorld + tR * depthGuess), 0.001, 0.999);
  vec2 uvG = clamp(projUV(vWorld + tG * depthGuess), 0.001, 0.999);
  vec2 uvB = clamp(projUV(vWorld + tB * depthGuess), 0.001, 0.999);
  // A refracted sample that lands on something above the waterline (rim, filter top) is not underwater:
  // fall back to the surface's own pixel instead of smearing the frame into the water
  if (worldAt(uvR).y > uWaterY - 0.02) uvR = suv;
  if (worldAt(uvG).y > uWaterY - 0.02) uvG = suv;
  if (worldAt(uvB).y > uWaterY - 0.02) uvB = suv;
  vec3 under = vec3(texture2D(uComp, uvR).r, texture2D(uComp, uvG).g, texture2D(uComp, uvB).b);

  vec3 refl = studioEnv(reflect(I, N)) * 0.55;
  vec3 col = mix(under, refl, F);

  vec3 H = normalize(normalize(uKeyDir) + V);
  float spec = pow(max(dot(N, H), 0.0), 500.0) * 6.0;
  col += vec3(1.0, 0.97, 0.9) * spec;
  col += vec3(0.5, 0.8, 0.9) * 0.08 * (1.0 - vWallFade);
  gl_FragColor = vec4(col, 1.0);
}`;

const MENISCUS_VERT = /* glsl */`

varying float vAlpha;
void main() {
  vAlpha = aAlpha;

}`;

const GLASS_FRAG = /* glsl */`
uniform sampler2D uSceneDepth;
uniform vec2 uRes;
uniform vec3 uCamPos;
uniform vec3 uPaneN;
varying vec3 vWorld;
varying vec3 vNrm;
${GLSL_STUDIO_ENV}

void main() {
  float sceneZ = texture2D(uSceneDepth, gl_FragCoord.xy / uRes).r;
  if (gl_FragCoord.z > sceneZ + 0.00025) discard;
  vec3 N = normalize(vNrm);
  vec3 V = normalize(uCamPos - vWorld);
  float c = clamp(abs(dot(N, V)), 0.0, 1.0);
  float F = 0.04 + 0.96 * pow(1.0 - c, 5.0);          // IOR 1.5
  vec3 refl = studioEnv(reflect(-V, N));
  // thickness faces show a faint green iron tint; flat faces only reflect
  float edge = 1.0 - abs(dot(N, uPaneN));
  vec3 edgeCol = vec3(0.30, 0.56, 0.50) * (0.3 + 0.7 * refl);
  vec3 col = mix(refl, edgeCol, edge);
  float a = mix(F + 0.012, 0.3 + 0.2 * F, edge);
  gl_FragColor = vec4(col, clamp(a, 0.0, 1.0));
}`;

const waterGeometry = new THREE.PlaneGeometry(WATER.x1 - WATER.x0, WATER.z1 - WATER.z0, 240, 120);
waterGeometry.rotateX(-Math.PI / 2);
const waterMaterial = new THREE.ShaderMaterial({
  uniforms: overlayUniforms,
  vertexShader: WATER_VERT,
  fragmentShader: WATER_FRAG,
  side: THREE.DoubleSide,
  depthTest: false,
  depthWrite: false,
  toneMapped: false,
});
const waterSurface = new THREE.Mesh(waterGeometry, waterMaterial);
waterSurface.name = 'WaterSurface';
waterSurface.frustumCulled = false;
overlay.add(waterSurface);

// Meniscus: a thin light band that climbs the glass at the waterline and fades inward
function buildMeniscus() {
  const profile = [[0.0, 0.055, 0.5], [0.02, 0.022, 0.3], [0.045, 0.006, 0.12], [0.085, 0.0, 0.0]];
  const edges = [
    { a: [WATER.x0, WATER.z0], b: [WATER.x1, WATER.z0], n: [0, 1] },
    { a: [WATER.x1, WATER.z0], b: [WATER.x1, WATER.z1], n: [-1, 0] },
    { a: [WATER.x1, WATER.z1], b: [WATER.x0, WATER.z1], n: [0, -1] },
    { a: [WATER.x0, WATER.z1], b: [WATER.x0, WATER.z0], n: [1, 0] },
  ];
  const positions = [];
  const alphas = [];
  const indices = [];
  const rings = profile.length;
  for (const e of edges) {
    const len = Math.hypot(e.b[0] - e.a[0], e.b[1] - e.a[1]);
    const steps = Math.ceil(len / 0.03);
    const start = positions.length / 3;
    for (let k = 0; k <= steps; k++) {
      const t = k / steps;
      const bx = e.a[0] + (e.b[0] - e.a[0]) * t;
      const bz = e.a[1] + (e.b[1] - e.a[1]) * t;
      for (const [off, h, al] of profile) {
        positions.push(bx + e.n[0] * off, WATER_Y + h + 0.002, bz + e.n[1] * off);
        alphas.push(al);
      }
    }
    for (let k = 0; k < steps; k++) {
      for (let r = 0; r < rings - 1; r++) {
        const a = start + k * rings + r;
        const b = a + 1;
        const d = a + rings;
        const c2 = d + 1;
        indices.push(a, d, b, b, d, c2);
      }
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute('aAlpha', new THREE.Float32BufferAttribute(alphas, 1));
  geo.setIndex(indices);
  const material = new THREE.ShaderMaterial({
    uniforms: { uSceneDepth: overlayUniforms.uSceneDepth, uRes: overlayUniforms.uRes },
    vertexShader: MENISCUS_VERT,
    fragmentShader: MENISCUS_FRAG,
    transparent: true,
    depthTest: false,
    depthWrite: false,
    side: THREE.DoubleSide,
    toneMapped: false,
  });
  const mesh = new THREE.Mesh(geo, material);
  mesh.name = 'Meniscus';
  mesh.frustumCulled = false;
  return mesh;
}
overlay.add(buildMeniscus());

// Five glass panes: front, back, left, right and bottom, each a thin box with visible thickness
function makeGlassPane(name, geometry, x, y, z, nx, ny, nz) {
  const material = new THREE.ShaderMaterial({
    uniforms: {
      uSceneDepth: overlayUniforms.uSceneDepth,
      uRes: overlayUniforms.uRes,
      uCamPos: overlayUniforms.uCamPos,
      uPaneN: { value: new THREE.Vector3(nx, ny, nz) },
    },
    vertexShader: GLASS_VERT,
    fragmentShader: GLASS_FRAG,
    transparent: true,
    depthWrite: false,
    depthTest: false,
    toneMapped: false,
  });
  const mesh = new THREE.Mesh(geometry, material);
  mesh.name = name;
  mesh.position.set(x, y, z);
  mesh.frustumCulled = false;
  return mesh;
}

const glassPanes = new THREE.Group();
glassPanes.name = 'GlassPanes';
overlay.add(glassPanes);
glassPanes.add(makeGlassPane('FrontPane', new THREE.BoxGeometry(8.0, 5.0, 0.06), 0, 2.5, 1.97, 0, 0, 1));
glassPanes.add(makeGlassPane('BackPane', new THREE.BoxGeometry(8.0, 5.0, 0.06), 0, 2.5, -1.97, 0, 0, 1));
glassPanes.add(makeGlassPane('LeftPane', new THREE.BoxGeometry(0.06, 5.0, 3.88), -3.97, 2.5, 0, 1, 0, 0));
glassPanes.add(makeGlassPane('RightPane', new THREE.BoxGeometry(0.06, 5.0, 3.88), 3.97, 2.5, 0, 1, 0, 0));
glassPanes.add(makeGlassPane('BottomPane', new THREE.BoxGeometry(7.88, 0.06, 3.88), 0, 0.03, 0, 0, 1, 0));

/* ================================================================
 * 15. Absorption, copy and display passes
 * ================================================================ */

// Beer-Lambert absorption along the view ray through the water box, plus a faint in-scatter tint.
// Distance inside the box comes from a slab test between the camera and the surface sample.
const COMPOSITE_FRAG = /* glsl */`
uniform sampler2D tColor;
uniform sampler2D tDepth;
uniform mat4 uInvViewProj;
uniform vec3 uCamPos;
uniform vec3 uBoxMin;
uniform vec3 uBoxMax;
uniform vec3 uSigma;
uniform vec3 uHaze;
varying vec2 vUv;
void main() {
  vec3 col = texture2D(tColor, vUv).rgb;
  float d = texture2D(tDepth, vUv).r;
  vec4 wp = uInvViewProj * vec4(vUv * 2.0 - 1.0, d * 2.0 - 1.0, 1.0);
  vec3 P = wp.xyz / wp.w;
  vec3 dir = P - uCamPos;
  float dist = length(dir);
  dir /= max(dist, 1e-5);
  if (d >= 0.99999) dist = 80.0;
  vec3 inv = 1.0 / (dir + vec3(1e-6));
  vec3 t0 = (uBoxMin - uCamPos) * inv;
  vec3 t1 = (uBoxMax - uCamPos) * inv;
  vec3 tmin = min(t0, t1);
  vec3 tmax = max(t0, t1);
  float tN = max(max(tmin.x, tmin.y), max(tmin.z, 0.0));
  float tF = min(min(tmax.x, tmax.y), min(tmax.z, dist));
  float L = max(tF - tN, 0.0);
  vec3 T = exp(-uSigma * L);
  gl_FragColor = vec4(col * T + uHaze * (1.0 - T), 1.0);
}`;

const COPY_FRAG = /* glsl */`
uniform sampler2D tSrc;
varying vec2 vUv;
void main() {
  gl_FragColor = texture2D(tSrc, vUv);
}`;

// ACES fit, sRGB encode, gentle vignette and dithering for the 8-bit canvas
const DISPLAY_FRAG = /* glsl */`
uniform sampler2D tSrc;
varying vec2 vUv;
vec3 aces(vec3 x) {
  const float a = 2.51;
  const float b = 0.03;
  const float c = 2.43;
  const float d = 0.59;
  const float e = 0.14;
  return clamp((x * (a * x + b)) / (x * (c * x + d) + e), 0.0, 1.0);
}
vec3 toSRGB(vec3 c) {
  return mix(12.92 * c, 1.055 * pow(c, vec3(1.0 / 2.4)) - 0.055, step(0.0031308, c));
}
void main() {
  vec3 c = toSRGB(aces(texture2D(tSrc, vUv).rgb));
  vec2 q = vUv - 0.5;
  c *= 1.0 - 0.35 * dot(q, q);
  c += (fract(sin(dot(gl_FragCoord.xy, vec2(12.9898, 78.233))) * 43758.5453) - 0.5) / 255.0;
  gl_FragColor = vec4(c, 1.0);
}`;

const compPass = makeFullscreenPass(COMPOSITE_FRAG, {
  tColor: { value: null },
  tDepth: { value: null },
  uInvViewProj: { value: new THREE.Matrix4() },
  uCamPos: overlayUniforms.uCamPos,
  uBoxMin: { value: new THREE.Vector3(WATER.x0, WATER.y0, WATER.z0) },
  uBoxMax: { value: new THREE.Vector3(WATER.x1, WATER.y1, WATER.z1) },
  uSigma: { value: new THREE.Vector3(0.045, 0.016, 0.010) },
  uHaze: { value: new THREE.Vector3(0.03, 0.22, 0.25) },
});
const copyPass = makeFullscreenPass(COPY_FRAG, { tSrc: { value: null } });
const displayPass = makeFullscreenPass(DISPLAY_FRAG, { tSrc: { value: null } });

/* ================================================================
 * 16. Simulation step, render pipeline, resize and interface
 * ================================================================ */

function updateSimulation(dt, t) {
  updateBubbles(dt, t);
  updateParticles(dt, t);
  plants.update(t);
  for (const f of fishes) updateFish(f, dt);
  for (const f of fishes) animateFish(f);
  updateCrab(crab, dt, t);
  for (const s of snails) s.update(dt, t);
}

const viewProj = new THREE.Matrix4();
const invViewProj = new THREE.Matrix4();

// 1. Underwater world  2. Water-column absorption  3. Copy + surface/glass overlay  4. Tone map to screen
function renderFrame() {
  camera.updateMatrixWorld();
  viewProj.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
  invViewProj.multiplyMatrices(camera.matrixWorld, camera.projectionMatrixInverse);
  overlayUniforms.uViewProj.value.copy(viewProj);
  overlayUniforms.uInvViewProj.value.copy(invViewProj);
  overlayUniforms.uCamPos.value.copy(camera.position);
  compPass.material.uniforms.uInvViewProj.value.copy(invViewProj);

  renderer.setRenderTarget(sceneRT);
  renderer.clear(true, true, true);
  renderer.render(world, camera);

  compPass.material.uniforms.tColor.value = sceneRT.texture;
  compPass.material.uniforms.tDepth.value = sceneRT.depthTexture;
  renderer.setRenderTarget(compRT);
  renderer.render(compPass.scene, orthoCamera);

  copyPass.material.uniforms.tSrc.value = compRT.texture;
  renderer.setRenderTarget(finalRT);
  renderer.render(copyPass.scene, orthoCamera);
  overlayUniforms.uComp.value = compRT.texture;
  overlayUniforms.uSceneDepth.value = sceneRT.depthTexture;
  renderer.render(overlay, camera);

  displayPass.material.uniforms.tSrc.value = finalRT.texture;
  renderer.setRenderTarget(null);
  renderer.clear();
  renderer.render(displayPass.scene, orthoCamera);
}

function onResize() {
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  const size = buildTargets();
  overlayUniforms.uRes.value.copy(size);
  // world-space particle size to pixels: focal length in pixels at this viewport height
  particleMaterial.uniforms.uScale.value = size.y / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
  homeDistance = fitHomeDistance();
}
window.addEventListener('resize', onResize);

let simTime = 0;
let paused = false;
const resetButton = document.getElementById('reset');
const pauseButton = document.getElementById('pause');
resetButton.addEventListener('click', resetView);
pauseButton.addEventListener('click', () => {
  paused = !paused;
  pauseButton.textContent = paused ? 'Продолжить' : 'Пауза';
  pauseButton.setAttribute('aria-pressed', String(paused));
});

let lastFrame = performance.now();
renderer.setAnimationLoop((now) => {
  // Clamp large steps (hidden tabs); pausing freezes simulation time but keeps the camera live
  const dt = clamp((now - lastFrame) / 1000, 0, 0.05);
  lastFrame = now;
  const sdt = paused ? 0 : dt;
  simTime += sdt;
  controls.update();
  constrainCameraTarget();
  CAUSTIC.uTime.value = simTime;
  updateSimulation(sdt, simTime);
  renderFrame();
});

onResize();
resetView();

</script>
