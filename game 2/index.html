  SND.roar();
}
function bossFrac() { return (BOSS.hull + BOSS.core) / (BOSS_HULL + BOSS_CORE); }

// World-space hit boxes for every part that can still be hit.
function bossBoxes() {
  const B = BOSS, f = B.face, bx = B.x, by = B.y;
  const span = (a, c) => (f > 0 ? { l: bx + a, r: bx + c } : { l: bx - c, r: bx - a });
  const out = [{ id: 'core', ...span(6, 22), t: by - 66, b: by - 50 }];
  if (B.att.armF) out.push({ id: 'armF', ...span(22, 40), t: by - 62, b: by - 42 });
  if (B.att.armB) out.push({ id: 'armB', ...span(-40, -22), t: by - 62, b: by - 42 });
  if (B.att.pod) out.push({ id: 'pod', ...span(-12, 12), t: by - 92, b: by - 74 });
  out.push({ id: 'hull', ...span(-26, 26), t: by - 74, b: by - 30 });
  return out;
}
function hitBoss(id, dmg) {
  const B = BOSS;
  if (!B || B.dying || B.st === 'drop') return false;
  if (id === 'core') B.core = Math.max(0, B.core - dmg);
  else if (id === 'hull') { B.hull = Math.max(0, B.hull - dmg * 0.5); if (dmg >= 1) spawnPart(B.x + rr(-20, 20), B.y - rr(35, 60), rr(-40, 40), rr(-60, -10), rr(0.3, 0.5), '#cfd6e0', 1.5, 200, 2); }
  else {
    B[id] = Math.max(0, B[id] - dmg);
    if (B[id] <= 0 && B.att[id]) detachPart(id);
  }
  B.hurt = 0.1;
  SND.hit();
  if (B.core <= 0) startBossDeath();
  return true;
}
function hitBossAt(b) {
  if (!BOSS || BOSS.dying || BOSS.st === 'drop') return false;
  for (const box of bossBoxes()) if (inRect(b.x, b.y, box)) return hitBoss(box.id, b.dmg);
  return false;
}
function hurtBossIn(x, y, rad, dmg) {
  if (!BOSS || BOSS.dying || BOSS.st === 'drop') return;
  for (const box of bossBoxes()) {
    const cx = (box.l + box.r) / 2, cy = (box.t + box.b) / 2;
    if (dist(cx, cy, x, y) < rad + 14) hitBoss(box.id, dmg);
  }
}
function laserHitBoss(x1, y1, x2, y2, dmg) {
  if (!BOSS || BOSS.dying || BOSS.st === 'drop') return;
  for (const box of bossBoxes()) {
    sampleAlong(x1, y1, x2, y2, (px, py) => {
      if (!inRect(px, py, box)) return false;
      hitBoss(box.id, dmg);
      return true;
    });
  }
}
function meleeBoss(r) {
  if (!BOSS || BOSS.dying || BOSS.st === 'drop') return;
  for (const box of bossBoxes()) if (rectHit(box, r)) { hitBoss(box.id, 2); return; }
}

// A part that reaches zero health tears off, leaving a stump.
function detachPart(id) {
  const B = BOSS, f = B.face;
  B.att[id] = false;
  const x = id === 'pod' ? B.x : B.x + f * 31, y = id === 'pod' ? B.y - 84 : B.y - 52;
  bdebris.push({ id, x, y, vx: id === 'pod' ? rr(-30, 30) : f * rr(40, 70), vy: -170, ang: 0, spin: rr(-7, 7), w: 14, h: 12, dead: false });
  for (let i = 0; i < 10; i++) spawnPart(x + rr(-8, 8), y + rr(-6, 6), rr(-90, 90), rr(-120, -30), rr(0.4, 0.8), pick(['#ffd34d', '#ff8a2b', '#8d8794']), rr(2, 3), GRAV, 1);
  floatText(x, y - 10, 'BREAK!', '#ffd34d');
  shake(5);
  SND.crate();
}
function updBossDebris(dt) {
  for (const d of bdebris) {
    d.vy = Math.min(d.vy + GRAV * dt, MAX_FALL);
    d.x += d.vx * dt; d.y += d.vy * dt; d.ang += d.spin * dt;
    if (d.y >= GROUND_Y - 6) { d.y = GROUND_Y - 6; d.vy = -Math.abs(d.vy) * 0.3; d.vx *= 0.6; d.spin *= 0.6; }
  }
}
function pickAttack() {
  const B = BOSS, opts = [];
  if (B.att.armF || B.att.armB) opts.push('slam', 'slam');
  if (B.att.pod) opts.push('missile', 'missile');
  if (B.phase >= 2) opts.push('chain', 'bombs', 'leap');
  if (B.phase >= 3 && (B.att.armF || B.att.armB)) opts.push('lasers');
  if (!opts.length) opts.push('chain');
  return pick(opts);
}
function startAttack(name) {
  const B = BOSS;
  B.atk = name; B.step = 0;
  if (name === 'slam') { B.tx = P.x; B.tm = 0.9; B.st = 'slamWind'; }
  else if (name === 'missile') { B.tm = 1.2; B.st = 'missile'; B.shots = 0; }
  else if (name === 'chain') { B.tm = 1.6; B.st = 'chain'; }
  else if (name === 'bombs') { B.tm = 1.8; B.st = 'bombs'; B.shots = 0; }
  else if (name === 'leap') { B.st = 'leap'; B.vy = -330; B.vx = clamp((P.x - B.x) / 0.9, -220, 220); }
  else if (name === 'lasers') { B.tm = 1.0; B.st = 'charge'; }
}
function bossFire(from, to, speed, dmg, kind, spread) {
  shootEnemy(from.x, from.y, to.x, to.y, speed, dmg, kind, spread);
}
function updBoss(dt) {
  if (!BOSS) return;
  const B = BOSS;
  B.hurt = Math.max(0, B.hurt - dt);
  updBossDebris(dt);
  if (B.dying) { updBossDeath(dt); return; }
  B.phase = bossFrac() > 0.66 ? 1 : bossFrac() > 0.33 ? 2 : 3;
  if (bossFrac() < 0.6 && Math.random() < dt * (bossFrac() < 0.3 ? 10 : 4)) {
    spawnPart(B.x + rr(-20, 20), B.y - rr(40, 70), rr(-6, 6), rr(-22, -10), rr(0.9, 1.4), '#6d6470', rr(4, 6), -10, 0.4, 'smoke');
  }
  if (bossFrac() < 0.3 && Math.random() < dt * 8) spawnPart(B.x + rr(-24, 24), B.y - rr(40, 70), rr(-60, 60), rr(-80, -20), rr(0.2, 0.4), '#fff3a0', 1.5, 200, 2);
  // the body hurts whoever stands under it
  if (!P.dead && !P.inTank && B.st !== 'drop' && rectHit(boxOf(P), { l: B.x - 26, r: B.x + 26, t: B.y - 74, b: B.y })) hurtPlayer(1, sgn(P.x - B.x));
  if (B.st === 'drop') {
    B.vy = Math.min(B.vy + GRAV * 0.6 * dt, 360);
    B.y += B.vy * dt;
    if (B.y >= GROUND_Y) {
      B.y = GROUND_Y; B.vy = 0; B.st = 'idle'; B.tm = 1.2;
      shake(9);
      for (let i = 0; i < 18; i++) spawnPart(B.x + rr(-40, 40), GROUND_Y - 2, rr(-90, 90), rr(-70, -10), rr(0.5, 0.9), '#d7b27a', rr(2, 4), GRAV, 1.5);
      SND.boom(40);
    }
    return;
  }
  // face the player unless mid-leap
  if (B.st !== 'leap') B.face = P.x >= B.x ? 1 : -1;
  const lk = G.lock || { left: 5800, right: 6184 };
  const minX = lk.left + 40, maxX = lk.right - 40;
  B.cd -= dt;
  switch (B.st) {
    case 'idle':
      B.tm -= dt;
      if (B.tm <= 0) {
        if (Math.abs(P.x - B.x) > 110 && Math.random() < 0.6) { B.st = 'walk'; B.tm = rr(0.8, 1.4); }
        else startAttack(pickAttack());
      }
      break;
    case 'walk':
      B.tm -= dt; B.step += dt * 6;
      B.x = clamp(B.x + B.face * 22 * dt, minX, maxX);
      if (B.tm <= 0) { B.st = 'idle'; B.tm = rr(0.5, 1); }
      break;
    case 'slamWind':
      B.tm -= dt;
      if (B.tm <= 0) { B.st = 'slamHit'; B.tm = 0.22; shake(5); SND.boom(12); }
      break;
    case 'slamHit': {
      B.tm -= dt;
      if (B.tm > 0.1 && !P.dead && P.onGround && Math.abs(P.x - B.tx) < 20) hurtPlayer(1, sgn(P.x - B.tx));
      if (B.tm <= 0) { B.st = 'idle'; B.tm = rr(0.9, 1.3); }
      break;
    }
    case 'missile':
      B.tm -= dt;
      if (B.shots < 3 && B.tm < 1.2 - (B.shots + 1) * 0.3) {
        const sx = B.x, sy = B.y - 88;
        ebul.push({ x: sx, y: sy, vx: rr(-60, 60), vy: -150, dmg: 1, kind: 'missile', life: 4, dead: false, home: true });
        B.shots++;
        SND.shot('rocket');
      }
      if (B.tm <= 0) { B.st = 'idle'; B.tm = B.phase === 3 ? 0.6 : rr(0.9, 1.3); }
      break;
    case 'chain':
      B.tm -= dt;
      if (B.cd <= 0 && !P.dead) {
        bossFire({ x: B.x + B.face * 30, y: B.y - 52 }, P, 170, 1, 'mg', 0.16);
        B.cd = 0.09;
      }
      if (B.tm <= 0) { B.st = 'idle'; B.tm = rr(0.8, 1.2); }
      break;
    case 'bombs':
      B.tm -= dt;
      if (B.shots < 6 && B.tm < 1.8 - (B.shots + 1) * 0.28) {
        const bxp = rr(minX, maxX);
        gren.push({ x: bxp, y: 16, vx: 0, vy: 40, w: 4, h: 4, t: 4, bounces: 0, onGround: false, from: 'e', dead: false, rad: 24, dmg: 1, bomb: true });
        B.shots++;
      }
      if (B.tm <= 0) { B.st = 'idle'; B.tm = rr(0.8, 1.2); }
      break;
    case 'leap':
      B.vy = Math.min(B.vy + GRAV * 1.1 * dt, 400);
      B.x = clamp(B.x + B.vx * dt, minX, maxX);
      B.y += B.vy * dt;
      if (B.y >= GROUND_Y && B.vy > 0) {
        B.y = GROUND_Y; B.vy = 0; B.vx = 0;
        shake(9); SND.boom(30);
        for (let i = 0; i < 16; i++) spawnPart(B.x + rr(-50, 50), GROUND_Y - 2, rr(-120, 120), rr(-60, -10), rr(0.5, 0.9), '#d7b27a', rr(2, 4), GRAV, 1.5);
        if (!P.dead && P.onGround && Math.abs(P.x - B.x) < 70) hurtPlayer(1, sgn(P.x - B.x));
        B.st = 'idle'; B.tm = rr(0.9, 1.3);
      }
      break;
    case 'charge':
      B.tm -= dt; B.charge = 1 - B.tm;
      if (B.tm <= 0) { B.st = 'beam'; B.tm = 1.4; B.beamLen = 0; SND.roar(); }
      break;
    case 'beam':
      B.tm -= dt;
      B.beamLen = Math.min(330, B.beamLen + 500 * dt);
      {
        const f = B.face, x1 = B.x + f * 30, x2 = x1 + f * B.beamLen, yy = GROUND_Y - 8;
        bbeams = [{ x1, x2, y: yy, t: 0.12, col: '#ff5a3c' }];
        if (!P.dead && !P.inTank && P.y - 16 < yy + 3 && P.y > yy - 2 && Math.min(x1, x2) < P.x + 4 && Math.max(x1, x2) > P.x - 4) {
          hurtPlayer(1, f);
        }
      }
      if (B.tm <= 0) { B.st = 'idle'; B.tm = rr(0.6, 1.0); bbeams = []; B.charge = 0; }
      break;
  }
  // a few more ambient attacks in phase 3
  if (B.phase === 3 && B.st === 'idle' && B.cd <= 0) B.cd = 3;
}
function startBossDeath() {
  const B = BOSS;
  if (B.dying) return;
  B.dying = true; B.dT = 0; B.st = 'dead';
  P.victory = true; P.shield = 99; P.inTank = false;
  for (const k of ['armF', 'armB', 'pod']) if (B.att[k]) detachPart(k);
  addScore(5000, B.x, B.y - 100);
  G.msg = { text: 'BOSS DOWN!', t: 3 };
  SND.boom(50);
}
function updBossDeath(dt) {
  const B = BOSS;
  B.dT += dt;
  if (Math.random() < dt * 9) boom(B.x + rr(-34, 34), B.y - rr(16, 84), rr(10, 16), 0, true);   // chain reaction
  if (!B.boomed && B.dT > 3.4) {
    B.boomed = true;
    boom(B.x, B.y - 40, 64, 0, true);
    shake(14);
  }
  if (B.dT > 5.4) {
    BOSS = null; bbeams = [];
    G.lock = null;
    G.won = true;
    go(Complete);
  }
}
function drawBoss() {
  if (!BOSS) return;
  const B = BOSS, f = B.face, bx = Math.round(scrX(B.x)), by = Math.round(B.y);
  // telegraphs
  if (B.st === 'drop') {
    const a = Math.min(0.5, (1 - Math.min(1, (GROUND_Y - B.y) / 150)) * 0.5);
    g.globalAlpha = a; g.fillStyle = '#000'; g.fillRect(bx - 34, GROUND_Y - 2, 68, 3); g.globalAlpha = 1;
  }
  if (B.st === 'slamWind') {
    const tx = Math.round(scrX(B.tx));
    g.fillStyle = Math.floor(T * 10) % 2 ? '#ff5a3c' : '#7a1e1e';
    g.fillRect(tx - 18, GROUND_Y - 2, 36, 2);
  }
  // legs stepping when walking
  const stepA = B.st === 'walk' ? Math.sin(B.step) : 0;
  const legs = [[-20, stepA], [4, -stepA]];
  for (const [dx, s] of legs) {
    const lift = s > 0 ? Math.round(s * 4) : 0;
    blit(sprite('bleg' + lift, 16, 34, p => paintBossLeg(p, lift)), Math.round(scrX(B.x + dx)), by - lift, 1);
  }
  blit(sprite('bhull' + Math.floor(B.hull / 8), 56, 44, p => paintBossHull(p, B.hull / BOSS_HULL)), Math.round(scrX(B.x)), by - 30, f, 0, B.hurt > 0.05);
  // cockpit core, colour shifts from amber to red as it weakens
  const core = B.core / BOSS_CORE;
  const cx = Math.round(scrX(B.x + f * 14)), cy = by - 58;
  g.fillStyle = core > 0.5 ? '#ffb347' : '#ff3b3b';
  g.globalAlpha = B.dying ? 0.4 : 0.6 + 0.4 * Math.sin(T * 6);
  g.fillRect(cx - 4, cy - 4, 8, 8);
  g.globalAlpha = 1;
  g.fillStyle = '#fff6c2'; g.fillRect(cx - 1, cy - 1, 2, 2);
  if (B.att.armF) blit(sprite('barm' + (B.charge > 0.5 ? 'g' : ''), 22, 20, p => paintBossArm(p, B.charge > 0.5 || B.st === 'beam')), Math.round(scrX(B.x + f * 31)), by - 42, f, 0, B.hurt > 0.05);
  if (B.att.armB) blit(sprite('barm' + (B.charge > 0.5 ? 'g' : ''), 22, 20, p => paintBossArm(p, B.charge > 0.5 || B.st === 'beam')), Math.round(scrX(B.x - f * 31)), by - 42, f, 0, B.hurt > 0.05);
  if (B.att.pod) blit(sprite('bpod', 24, 16, paintBossPod), Math.round(scrX(B.x)), by - 74, 1, 0, B.hurt > 0.05);
  // telegraphed missile pods / beam glow
  if (B.st === 'beam') {
    const x1 = Math.round(scrX(B.x + f * 30)), x2 = Math.round(scrX(B.x + f * (30 + B.beamLen)));
    g.fillStyle = '#ff5a3c'; g.fillRect(Math.min(x1, x2), GROUND_Y - 10, Math.abs(x2 - x1), 4);
  }
}
function paintBossHull(p, hp) {
  p.r(0, 0, 56, 44, '#2a2f3b'); p.r(2, 2, 52, 40, '#5b6273');
  p.r(0, 14, 56, 2, '#2a2f3b'); p.r(0, 30, 56, 2, '#2a2f3b');
  for (let x = 4; x < 56; x += 8) { p.dot(x, 8, 1, '#8a92a4'); p.dot(x, 36, 1, '#8a92a4'); }
  p.r(4, 4, 6, 4, '#2a2f3b'); p.r(44, 4, 6, 4, '#2a2f3b');
  p.r(20, 20, 16, 3, '#ffd34d');                                  // warning stripe
  if (hp < 0.8) p.r(30, 18, 10, 6, '#1f232d');
  if (hp < 0.5) { p.line(20, 10, 34, 24, 1, '#1a1e26'); p.line(44, 6, 36, 20, 1, '#1a1e26'); }
}
function paintBossArm(p, glow) {
  p.r(0, 4, 14, 12, '#5b6273'); p.r(2, 6, 10, 2, '#7a8192');
  p.r(12, 7, 10, 5, '#2a2f3b');
  if (glow) p.dot(20, 9.5, 2.6, '#ff8a2b');
}
function paintBossPod(p) {
  p.r(0, 4, 24, 10, '#4b5263');
  for (let i = 0; i < 3; i++) { p.dot(4 + i * 8, 8, 2.8, '#2a2f3b'); p.dot(4 + i * 8, 8, 1.4, '#ff4d6d'); }
}
function paintBossLeg(p, lift) {
  p.r(3, 0, 10, 14, '#4b5263');
  p.r(4, 12, 8, 16 - lift, '#3c4150');
  p.r(0, 26 - lift, 16, 6, '#2a2f3b');
}
function drawBossDebris() {
  for (const d of bdebris) {
    const sx = Math.round(scrX(d.x));
    if (sx < -20 || sx > W + 20) continue;
    blit(sprite('bdeb' + d.id, 14, 12, p => (d.id === 'pod' ? paintBossPod(p) : paintBossArm(p, false))), sx, d.y + 6, 1, d.ang);
  }
  for (const b of bbeams) {
    const a = b.t / 0.12;
    g.globalAlpha = 0.5 + 0.5 * a;
    g.fillStyle = b.col; g.fillRect(Math.round(scrX(Math.min(b.x1, b.x2))), Math.round(b.y) - 2, Math.round(Math.abs(b.x2 - b.x1)), 5);
    g.fillStyle = '#fff3d6'; g.fillRect(Math.round(scrX(Math.min(b.x1, b.x2))), Math.round(b.y), Math.round(Math.abs(b.x2 - b.x1)), 1);
    g.globalAlpha = 1;
  }
}
function updBossFx(dt) {
  for (const b of bbeams) b.t -= dt;
  bbeams = bbeams.filter(b => b.t > 0);
}

// ============================================================
// 16. HUD, FEEDBACK AND SCREENS - score, lives, health, ammo, messages, pause, game over, stage clear
// ============================================================
const CAPTIVE_TOTAL = 5;
let hitStop = 0, flashA = 0, hurtFlash = 0;
const pad = (n, len) => String(n).padStart(len, '0');

function saveHi() {
  if (G.score > G.hi) { G.hi = G.score; store.set('hi', G.hi); }
}
// Death: spend a life and return to the checkpoint, or show the game-over screen.
function afterDeath() {
  if (G.lives > 0) {
    G.lives--;
    restoreCheckpoint();
    G.msg = { text: 'RETRY!', t: 1.4 };
  } else {
    saveHi();
    go(GameOver);
  }
}
function updFx(dt) {
  flashA = Math.max(0, flashA - dt * 2.4);
  hurtFlash = Math.max(0, hurtFlash - dt * 2.4);
}
// Big, wobbling title letters with a colour cycle.
function textWave(str, cx, y, sc, t) {
  const x0 = Math.round(cx - textW(str, sc) / 2);
  const cols = ['#ffd34d', '#ff9a2b', '#ff5a4a'];
  for (let i = 0; i < str.length; i++) {
    const ch = str[i].toUpperCase();
    const dy = Math.round(Math.sin(t * 4 + i * 0.7) * sc * 0.5);
    const x = x0 + i * 4 * sc;
    glyphs(ch, x + sc, y + dy + sc, '#140a1c', sc);
    glyphs(ch, x, y + dy, cols[(i + Math.floor(t * 3)) % cols.length], sc);
  }
}
function drawFlashes() {
  if (flashA > 0) { g.globalAlpha = Math.min(0.6, flashA); g.fillStyle = '#fff6c2'; g.fillRect(0, 0, W, H); g.globalAlpha = 1; }
  if (hurtFlash > 0) { g.globalAlpha = Math.min(0.3, hurtFlash); g.fillStyle = '#ff2a2a'; g.fillRect(0, 0, W, H); g.globalAlpha = 1; }
}
function drawHUD() {
  panel(0, 0, W, 11, 0.55);
  text('SCORE ' + pad(G.score, 6), 3, 3, '#ffffff', 1, 'l', false);
  text('HI ' + pad(G.hi, 6), W / 2, 3, '#ffd34d', 1, 'c', false);
  text('RESCUED ' + G.rescued + '/' + CAPTIVE_TOTAL, W - 3, 3, '#7fd4ff', 1, 'r', false);
  panel(0, H - 11, W, 11, 0.55);
  for (let i = 0; i < 3; i++) { g.fillStyle = i < P.hp ? '#ff4d6d' : '#3a2f44'; g.fillRect(3 + i * 7, H - 8, 5, 5); }
  text('X' + G.lives, 27, H - 9, '#ffffff', 1, 'l', false);
  const w = WEAPONS[G.weapon];
  const ammo = G.weapon === 'pistol' ? 'INF' : String(G.ammo[G.weapon]);
  text(w.name + ' ' + ammo, W / 2, H - 9, w.col, 1, 'c', false);
  text('GRN ' + G.grenades, W - 3, H - 9, '#9be36b', 1, 'r', false);
  if (P.shield > 0) text('SHIELD ' + Math.ceil(P.shield), 40, H - 9, '#7fd4ff', 1, 'l', false);
  if (BOSS && !BOSS.dying && BOSS.st !== 'drop') drawBossBar();
  if (P.inTank && TANK) drawTankBar();
}
function drawBossBar() {
  const f = bossFrac();
  text('COLOSSUS MK-IV', W / 2, 15, '#ffffff', 1, 'c');
  g.fillStyle = '#ffffff'; g.fillRect(91, 22, 202, 8);
  g.fillStyle = '#2a1520'; g.fillRect(92, 23, 200, 6);
  g.fillStyle = f > 0.33 ? '#ff5a4a' : '#ff1f3d'; g.fillRect(92, 23, Math.round(200 * f), 6);
  g.fillStyle = '#ffd6de'; g.fillRect(92, 23, Math.round(200 * f), 1);
}
function drawTankBar() {
  text('TANK', 3, 15, '#e6f0a0', 1, 'l', false);
  for (let i = 0; i < 8; i++) { g.fillStyle = i < TANK.hp ? '#8fd14f' : '#2e3a22'; g.fillRect(30 + i * 6, 15, 5, 5); }
}
function drawGoArrow() {
  const x = W - 40 + Math.round(Math.sin(T * 8) * 3), y = 100;
  g.fillStyle = '#ffd34d';
  g.fillRect(x - 14, y - 3, 14, 6);
  g.beginPath(); g.moveTo(x, y - 9); g.lineTo(x + 14, y); g.lineTo(x, y + 9); g.closePath(); g.fill();
  g.fillStyle = INK_HEX; g.fillRect(x - 15, y - 4, 1, 8);
}
function drawPause() {
  panel(0, 0, W, H, 0.65);
  text('PAUSED', W / 2, 52, '#ffd34d', 3, 'c');
  text('P OR ESC  RESUME', W / 2, 96, '#ffffff', 1, 'c');
  text('Q  QUIT TO TITLE', W / 2, 110, '#ffffff', 1, 'c');
  text('M  MUTE / UNMUTE', W / 2, 124, '#ffffff', 1, 'c');
  text('ARROWS MOVE   SPACE JUMP   X FIRE   G GRENADE', W / 2, 154, '#c9b8d8', 1, 'c');
  text('K KNIFE   Q WEAPON   E ENTER TANK   UP/DOWN AIM', W / 2, 166, '#c9b8d8', 1, 'c');
}

const GameOver = {
  t: 0,
  init() { this.t = 0; saveHi(); SND.music(null); SND.die(); },
  update(dt) {
    this.t += dt;
    const left = 9 - this.t;
    if (G.credits > 0 && left > 0 && (pressed('start') || pressed('jump') || pressed('fire'))) {
      G.credits--;
      G.lives = 3;
      restoreCheckpoint();
      go(Play);
      return;
    }
    if (left <= 0) go(Title);
  },
  draw() {
    drawSky('#2a0f1f', '#080409');
    text('GAME OVER', W / 2, 46, '#ff5a4a', 3, 'c');
    const left = Math.max(0, Math.ceil(9 - this.t));
    if (G.credits > 0) {
      text('CONTINUE? ' + left, W / 2, 104, '#ffe066', 2, 'c');
      text('CREDITS ' + G.credits + '   PRESS START', W / 2, 130, '#ffffff', 1, 'c');
      text('CONTINUE FROM THE CHECKPOINT WITH 3 LIVES', W / 2, 144, '#c9b8d8', 1, 'c');
    } else {
      text('NO CREDITS LEFT', W / 2, 104, '#ff9a4a', 2, 'c');
    }
    text('SCORE ' + pad(G.score, 6), W / 2, 170, '#ffffff', 1, 'c');
    text('HI ' + pad(G.hi, 6), W / 2, 182, '#ffd34d', 1, 'c');
  }
};

const Complete = {
  t: 0, tally: [], total: 0, rank: 'C',
  init() {
    this.t = 0;
    this.tally = [
      ['SCORE', G.score],
      ['CAPTIVES ' + G.rescued + '/' + CAPTIVE_TOTAL, G.rescued * 1000],
      ['FULL RESCUE', G.rescued === CAPTIVE_TOTAL ? 5000 : 0],
      ['HEALTH LEFT', P.hp * 500],
      ['TIME BONUS', Math.max(0, 6000 - Math.floor(G.levelT) * 12)]
    ];
    this.total = this.tally.reduce((s, r) => s + r[1], 0);
    this.rank = this.total >= 40000 ? 'S' : this.total >= 30000 ? 'A' : this.total >= 20000 ? 'B' : 'C';
    G.score = this.total;
    saveHi();
    SND.music('menu');
  },
  update(dt) {
    this.t += dt;
    if (this.t > 1 && (pressed('start') || pressed('jump') || pressed('fire'))) go(Title);
  },
  draw() {
    drawSky('#20142e', '#0b0712');
    textWave('STAGE CLEAR', W / 2, 16, 3, this.t);
    let y = 58;
    this.tally.forEach((row, i) => {
      if (this.t < 0.8 + i * 0.6) return;
      text(row[0], 70, y, '#ffffff', 1, 'l');
      text(String(row[1]), W - 70, y, '#ffe066', 1, 'r');
      y += 13;
    });
    if (this.t > 0.8 + this.tally.length * 0.6) {
      text('TOTAL ' + this.total, W / 2, y + 6, '#ffffff', 2, 'c');
      const col = this.rank === 'S' ? '#ffd34d' : this.rank === 'A' ? '#7fd4ff' : this.rank === 'B' ? '#9be36b' : '#c9b8d8';
      text('RANK ' + this.rank, W / 2, y + 28, col, 3, 'c');
    }
    if (this.t > 1 && Math.floor(this.t * 2) % 2 === 0) text('PRESS START', W / 2, H - 12, '#ffffff', 1, 'c');
  }
};

// ============================================================
// 17. BOOT
// ============================================================
setupTouch();
fitCanvas();
go(Title);
lastNow = performance.now();
requestAnimationFrame(frame);
</script>
